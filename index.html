<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>start-up idea generation</title>

  <style>

      @font-face {
        font-family : 'mycustomfont';
        src:url(./AppleGaramond-Bold.ttf);
      }

      @font-face {
        font-family : 'europalight';
        src:url(./EuropaGroteskSH-Lig.otf);

      }


    body{

      min-height:100vh;

      display: flex;
      flex-direction: column;

      position: relative;
      
    }

    body::before {
    content: "";

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: radial-gradient(
      circle at top,
      #06413B,
      #003631 45%,
      #002D29 100%
    );

    z-index: -1;
}

    .page {

      flex: 1;

      max-width : 1000px;

      margin-left : auto;
      margin-right : auto;

      padding : 70px 25px 100px;

      text-align: center;
    }

    .title {
      font-family : 'mycustomfont';

      font-size : 85px;

      line-height : 0.95;

      

      color : #FFEDA8;

      margin : 0;

     }

    .description {
      font-family : 'europalight';
      font-weight : bold;

      font-size : 21px;
      line-height : 1;
      letter-spacing: 0.03cm;

      color : white;
      
      max-width: 700px;
      margin : 25px auto 0 ;
    }

    .discover {
      font-family : 'europalight';
      font-weight: bold;
      font-size : 30px;
      color: #FFEDA8;
      margin : 35px 0 0;
      letter-spacing: 0.02cm;
    }

    .click {
      font-family : 'europalight';

      font-size : 15px;
      opacity: 0.7;

      letter-spacing: 0.03cm;

      font-weight : bold;

      color : white;

      margin-top : 100px;

        }

    .idea-button {

      font-family: 'europalight';

      font-size: 34px;
      font-weight: bold;
      letter-spacing: 0.03cm;

      color: #FFEDA8;

      background: rgba(255, 237, 168, 0.08);

      border: 1.5px solid rgba(255, 237, 168, 0.46);

      padding: 12px 42px;

      border-radius: 100px;

      cursor: pointer;

      backdrop-filter: blur(10px);

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        0 10px 30px rgba(0, 0, 0, 0.18);

      transition:
        background-color 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
                  
      }

    .idea-button:hover {
      background: rgba(255, 237, 168, 0.16);

      border-color: rgba(255, 237, 168, 0.8);

      transform: translateY(-2px);

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        0 12px 30px rgba(0, 0, 0, 0.18);
    }
    

    

    .idea-card {

      display: none;

      background-color: #FAF7ED;

      color:#162A27;

      max-width: 760px;

      margin: 70px auto 0;

      padding: 48px;

      border-radius: 18px;

      text-align: left;

    }


    .idea-here {
      font-family : 'mycustomfont';

      font-size : 54px;

      line-height : 1.12;

      color: #003631;

      margin : 0;
      
    }

    .idea-description {
      font-family : 'europalight';

      letter-spacing : 0.045cm;

      font-size : 24px;
      line-height : 1;

      color : #364744;

      font-weight: bold;

      max-width : 650px;

      margin : 24px 0 0;
      
    }

  .idea-section {
    margin-top : 42px;

    padding-top : 28px;

    border-top : 1px solid #c2c2bb;
  }

  .section-label {
    font-family : 'europalight';
    text-transform: uppercase;
    font-size : 19px;
    font-weight: 600;
    letter-spacing: 0.05cm;
    color : #6B746F;

    margin : 0 0 15px ;
  }

    .idea-problem {
      font-family : 'europalight';
      letter-spacing : 0.045cm;

      font-size : 23px;
      line-height : 1; 

      color : #354B45;

      font-weight : bold;
      
      margin: 0;

    }

    .idea-meta {
      display : flex;

      gap : 70px;

      margin-top : 45px;

      padding-top : 30px;

      border-top: 1px solid #c2c2bb;
    }

    .meta-label {
      font-family: 'europalight';

      font-weight:600;
      font-size: 19px;

      text-transform: uppercase;

      letter-spacing: 0.06cm;

      color: #64716A;

      margin : 0 0 8px;
    }

    .idea-source,
    .idea-date {
      font-family : 'europalight';

      font-size : 30px;
      font-weight : bold;

      letter-spacing: 0.02cm;

      color: #28543d;

      margin: 0;
    }

    .idea-link {
      display:inline-block;

      font-family : 'europalight';

      font-size : 25px;
      font-weight: bold;

      letter-spacing: 0.03cm;

      color: #003631;

      margin-top: 35px;

      text-decoration: none;

      border-bottom: 1px solid #003631;

      padding-bottom : 3px;

    }

    .idea-link:hover {

      color:#DDDCCF;
      border-color : #693317;
      background-color: #693317;
      


    }

    .idea-category {
      display : inline-block;

      font-family : 'europalight';

      font-size : 16px;
      font-weight : bold;

      text-transform : uppercase;
      letter-spacing : 2px;

      background-color : #E5EBDD;
      color : #244E41;

      padding : 9px 16px;

      border-radius : 100px ;

      margin : 0 0 24px;

    }

    .creator-footer {
  text-align: center;

  padding: 30px 20px 40px;
}


.creator-link {
  display: inline-flex;

  align-items: center;

  gap: 10px;

  font-family: 'europalight';

  font-size: 17px;
  font-weight: bold;

  letter-spacing: 0.02cm;

  color: #FFEDA8;

  text-decoration: none;

  border: 1px solid #FFEDA8;

  padding: 8px 14px 8px 9px;

  border-radius: 100px;

  transition:
    background-color 0.2s ease,
    color 0.2s ease;
}


.creator-link:hover {
  background-color: #FFEDA8;

  color: #003631;
}


.instagram-circle {
  width: 28px;
  height: 28px;

  border-radius: 50%;

  background-color: #FFEDA8;

  display: flex;

  align-items: center;
  justify-content: center;
}


.instagram-icon {
  width: 16px;
  height: 16px;
}

    

  </style>



</head>

<body>

  <main class="page">

    <h1 class="title">What Should I Build?</h1>

    <p class="description">
      Explore startup ideas shaped by Y Combinator, founder insights, emerging opportunities, and credible startup research.
    </p>

    <p class="discover">
     Discover what’s worth building next.
    </p>

    <p class="click">*click on the button.</p>

    <button onclick="generateTheIdea()" class="idea-button">
    Generate idea
    </button>

    

    <div class="idea-card">

      <p class="idea-category"></p>

      <h2 class="idea-here"></h2>

      <p class="idea-description"></p>

        <div class="idea-section">

          <p class="section-label">The problem</p>

          <P class="idea-problem"></P>

    </div>

    <div class="idea-meta">

      <div>

        <p class="meta-label">Source</p>
        <p class="idea-source"></p>
    
      </div>

      <div>
      <p class="meta-label">Date</p>
      <p class="idea-date"></p>
      </div>

    </div>

      <a class="idea-link" href=""
      target="_blank"
      rel="noopener noreferrer"
      
      >View original source →</a>


  </div>

  </main>

    <footer class="creator-footer">

    <a
    class="creator-link"
    href="https://www.instagram.com/adn44nn.dr/"
    target="_blank"
    rel="noopener noreferrer"
    >

    <span class="instagram-circle">
      <img
        src="instagram-icon.png"
        alt=""
        class="instagram-icon"
      >
    </span>

    Made by @adn44nn.dr

    </a>

  </footer>

<script src="script.js"></script>

</body>

</html>
